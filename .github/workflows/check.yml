name: Check (format / analyze / test)

# PR 与 main 推送的护栏：复用 scripts/check-flutter.sh（format → analyze →
# flutter test → node 测试），让问题在进 main 之前就红。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FLUTTER_VERSION: "3.47.7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format / analyze / test
        run: bash scripts/check-flutter.sh
