<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Ghost Codex Inspect · 远程端</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 顶栏：模式指示（跟随宿主会话自动切换，不再手选）+ 连接状态 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-name">Ghost Codex Inspect</span>
      <span class="app-sub">远程端</span>
    </div>

    <div class="mode-status">
      <span id="mode-label" class="mode-label">等待会话…</span>
      <div class="traffic-stats" title="本页启动以来的 WebSocket 消息收发合计，不含传输层开销；重连继续累计，刷新重新计数。">
        <span>平均 <span id="traffic-average">0 B/s</span></span>
        <span>累计 <span id="traffic-total">0 B</span></span>
        <span id="freshness" class="freshness hidden" aria-live="off" title="WebSocket 心跳往返时间（RTT），不含视频采集、编码和解码耗时。"></span>
      </div>
      <span id="ro-badge" class="ro-badge hidden">只读预览</span>
      <span id="conn-indicator" class="conn-indicator disconnected" title="连接状态">
        <span class="conn-dot"></span>
        <span id="conn-text">未连接</span>
      </span>
    </div>

    <div class="topbar-right">
      <div id="zoom-control" class="zoom-control" aria-label="远程界面缩放">
        <button id="zoom-out" type="button" aria-label="缩小远程界面">−</button>
        <span id="zoom-value" aria-live="polite">100%</span>
        <button id="zoom-in" type="button" aria-label="放大远程界面">+</button>
      </div>
      <!-- #17：视图尺寸模式切换（自适应/原始尺寸） -->
      <button id="size-toggle" class="size-toggle" aria-pressed="false">自适应</button>
      <button id="keyboard-toggle" class="size-toggle" type="button">打开键盘</button>
      <details id="more-settings" class="more-settings">
        <summary class="size-toggle" aria-label="更多设置">更多 <span aria-hidden="true">⋯</span></summary>
        <div class="settings-panel">
          <div id="pointer-settings" class="input-settings">
            <div class="settings-heading">操控方式</div>
            <label class="settings-row" for="input-mode">触摸操作
              <select id="input-mode" aria-label="操控方式">
                <option value="direct">直接触摸（双指滚动）</option>
                <option value="trackpad">模拟鼠标</option>
              </select>
            </label>
            <p id="trackpad-hint" class="trackpad-hint hidden">单指移动、轻点左键；双指滚动、轻点右键。双击后按住可拖拽。</p>
          </div>
          <div id="video-settings" class="video-settings hidden">
            <div class="settings-heading">视频设置</div>
            <label class="settings-row" for="playback-path">播放方式
              <select id="playback-path" aria-label="播放路径">
                <option value="auto">自动</option>
                <option value="webcodecs">WebCodecs</option>
                <option value="mse">MSE（兼容）</option>
              </select>
            </label>
            <label class="settings-row" for="decode-pref">解码偏好
              <select id="decode-pref" aria-label="解码偏好">
                <option value="auto">自动</option>
                <option value="hardware">硬解</option>
                <option value="software">软解</option>
              </select>
            </label>
            <label class="settings-row" for="fps-select">视频帧率
              <select id="fps-select" aria-label="帧率">
                <option value="15">15 fps</option>
                <option value="30" selected>30 fps</option>
                <option value="60">60 fps</option>
              </select>
            </label>
            <button id="probe-decode" class="size-toggle" title="检测本浏览器对各编码格式的硬解/软解支持">检测解码支持</button>
            <span id="decode-support" class="freshness hidden"></span>
          </div>
        </div>
      </details>
    </div>
  </header>

  <!-- 错误横幅：鉴权失败 / 协议错误等需要用户注意的情况 -->
  <div id="error-banner" class="error-banner hidden" role="alert"></div>

  <!-- shell 页签栏（#16）：目标应用有多个 shell 页面（主窗口 / 分离窗口 /
       头像浮层等）时切换接管对象；数据来自宿主广播的 ctrl shells 信封 -->
  <nav id="shell-tabs" class="shell-tabs hidden" role="tablist" aria-label="shell 页面切换"></nav>

  <!-- 主区域：DOM 重绘模式的 iframe 舞台 / 画面流模式占位 -->
  <main class="stage">
    <section id="stage-dom" class="stage-pane" aria-label="DOM 重绘模式">
      <div id="replayer-host" class="replayer-host">
        <!-- Replayer 的 sandboxed iframe 挂载于此（接入点，#11 接通数据通道后启用） -->
        <div id="stage-placeholder" class="stage-placeholder">
          <p>等待中转推送目标应用画面…</p>
          <p class="hint">DOM 重绘模式的数据通道由后续工单接通；当前显示骨架页面。</p>
        </div>
      </div>
    </section>

    <section id="stage-video" class="stage-pane hidden" aria-label="视频流模式">
      <div id="video-host" class="video-host">
        <div id="video-placeholder" class="stage-placeholder">
          <p>等待视频流…</p>
          <p class="hint">视频流由宿主侧启动（H.264 编码，需 ffmpeg），远程端被动播放。</p>
        </div>
      </div>
    </section>
    <div id="mouse-controls" class="mouse-controls hidden" aria-label="模拟鼠标操作">
      <button id="mouse-right" type="button">右键</button>
      <button id="mouse-drag" type="button" aria-pressed="false">拖拽</button>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
