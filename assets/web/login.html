<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Ghost Codex Inspect · 验证访问密钥</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #f5f5f7; color: #1d1d1f; }
    main { width: min(100%, 400px); padding: 32px; border: 1px solid #d9d9de;
      border-radius: 16px; background: #fff; }
    .brand { margin: 0 0 24px; color: #6e6e73; font-size: 13px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #6e6e73; }
    label { display: block; margin-bottom: 8px; }
    input, button { width: 100%; min-height: 44px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #9e9ea5; padding: 8px 12px; background: transparent; color: inherit; }
    input:focus { outline: 3px solid #0a84ff66; outline-offset: 2px; }
    button { margin-top: 16px; border: 0; background: #007aff; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #error { min-height: 24px; margin: 12px 0 0; color: #c9342b; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e20; color: #f5f5f7; }
      main { background: #2a2a2d; border-color: #454549; }
      p, .brand { color: #a1a1a6; }
      #error { color: #ff6961; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Ghost Codex Inspect · 远程访问</p>
    <h1>验证访问密钥</h1>
    <p>输入宿主端设置的访问密钥，验证后进入远程界面。</p>
    <form id="login-form">
      <label for="access-key">访问密钥</label>
      <input id="access-key" name="key" type="password" autocomplete="current-password" required autofocus />
      <button id="submit" type="submit">验证并进入</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script type="module">
    const form = document.getElementById('login-form');
    const input = document.getElementById('access-key');
    const button = document.getElementById('submit');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ key: input.value }),
        });
        if (response.ok) {
          input.value = '';
          if (location.pathname === '/') location.reload();
          else location.replace('/' + location.hash);
          return;
        }
        error.textContent = response.status === 401 ? '访问密钥不正确，请重试。' : '验证失败，请稍后重试。';
      } catch {
        error.textContent = '无法连接宿主，请检查网络后重试。';
      }
      button.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
